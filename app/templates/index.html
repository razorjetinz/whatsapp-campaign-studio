<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111c2e">
  <title>WhatsApp Campaign Studio</title>
  <link rel="stylesheet" href="/static/styles.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand-lockup">
        <div class="brand-mark">W</div>
        <div><div class="brand-name">Campaign Studio</div><div class="brand-caption">WhatsApp Business Platform</div></div>
      </div>
      <div class="nav-label">WORKSPACE</div>
      <nav class="main-nav" aria-label="Main navigation">
        <button class="nav-item active" data-view="overview"><span class="nav-icon">▦</span> Overview</button>
        <button class="nav-item" data-view="contacts"><span class="nav-icon">♙</span> Contacts</button>
        <button class="nav-item" data-view="groups"><span class="nav-icon">▤</span> Groups</button>
        <button class="nav-item" data-view="campaigns"><span class="nav-icon">➤</span> Campaigns</button>
        <button class="nav-item" data-view="templates"><span class="nav-icon">▧</span> Templates</button>
        <button class="nav-item" data-view="settings"><span class="nav-icon">⚙</span> Settings</button>
      </nav>
      <div class="sidebar-bottom">
        <div class="sidebar-note"><span class="status-dot"></span><span>Self-hosted workspace</span></div>
        <a href="https://github.com/" target="_blank" rel="noreferrer">Open GitHub ↗</a>
      </div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <div><div class="eyebrow">MESSAGING WORKSPACE</div><h1 id="page-title">Overview</h1></div>
        <div class="topbar-right"><span class="secure-label"><span class="status-dot"></span> Private dashboard</span><div class="avatar">A</div></div>
      </header>
      <section id="mode-banner" class="mode-banner hidden"></section>
      <div id="toast" class="toast hidden" role="status"></div>
      <section id="view-root" class="view-root" aria-live="polite"></section>
      <footer class="footer"><span>WhatsApp Campaign Studio</span><span>Open source · Self-hosted · Consent-first</span></footer>
    </main>
  </div>
</body>
</html>
