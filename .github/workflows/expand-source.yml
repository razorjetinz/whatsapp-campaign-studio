name: Expand source bundle

on:
  push:
    branches: [main]
    paths:
      - source-bundle.ready

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Expand the source archive
        run: |
          base64 --decode source-bundle.zip.b64 > /tmp/whatsapp-campaign-studio.zip
          unzip -q /tmp/whatsapp-campaign-studio.zip -d /tmp/project
          cp -a /tmp/project/wa-campaign-studio/. .
          rm -f .github/workflows/tests.yml
          rm -f source-bundle.zip.b64 source-bundle.ready

      - name: Commit source files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: publish WhatsApp Campaign Studio source files"
          git push
